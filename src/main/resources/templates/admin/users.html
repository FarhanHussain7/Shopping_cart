<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">

<head>
    <meta charset="UTF-8">
    <title>User List</title>
</head>

<body>
    <section>
        <div class="container-fluid mt-5 p-5">
            <div class="card card-sh">
                <div class="card-header text-center">
                    <p class="fs-4">User</p>

                    <!-- Success message -->
                    <th:block th:if="${session.successMsg}">
                        <p class="text-success fw-bold">[[${session.successMsg}]]</p>
                        <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>

                    <!-- Error message -->
                    <th:block th:if="${session.errorMsg}">
                        <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                        <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                    </th:block>
                </div>

                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Sl No.</th>
                                <th scope="col">Profile</th>
                                <th scope="col">Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Mobile no</th>
                                <th scope="col">Address</th>
                                <th scope="col">Status</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u, c : ${users}">
                                <th scope="row">[[${c.count}]]</th>
                                <td>
                                    <img th:src="@{'/img/profile_img/' + ${u.profileImage}}" width="70" height="70">
                                </td>
                                <td>[[${u.name}]]</td>
                                <td>[[${u.email}]]</td>
                                <td>[[${u.mobileNumber}]]</td>
                                <td>[[${u.address}]], [[${u.city}]], [[${u.state}]], [[${u.pincode}]]</td>
                                <td th:text="${u.enabled} ? 'Active' : 'Inactive'"></td>
                                <td>
                                    <a th:href="@{'/admin/updateSts?status=true&id='+ ${u.id}}" class="btn btn-sm btn-primary">
                                       Active
                                    </a>
                                    <a th:href="@{'/admin/updateSts?status=false&id='+ ${u.id}}" class="btn btn-sm btn-danger">
                                       InActive
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
